[project]
name = "tracelab-core"
version = "0.1.0"
description = "Headless TraceLab analysis core for VS Code extension"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pathspec>=0.12.1",
  "pypdf>=4.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
tracelab = "tracelab_core.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracelab_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=tracelab_core.workspace",
  "--cov=tracelab_core.review",
  "--cov=tracelab_core.probe",
  "--cov-report=term-missing",
  "--cov-fail-under=90.01",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
