[project]
name = "paper-code-trace-backend"
version = "0.1.0"
description = "FastAPI backend for the paper-code bidirectional trace workbench."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0",
  "pathspec>=0.12.1",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0",
  "pypdf>=4.3.0"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]
desktop = [
  "pyinstaller>=6.14.0",
  "basedpyright>=1.29.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
