x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tracelab}
    volumes:
      - /srv/tracelab/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 1.0
    logging: *default-logging
    networks: [private]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${CLOUD_ENV_FILE:-.env.cloud}
    environment:
      RUNTIME_MODE: cloud
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracelab}
      CLOUD_BLOB_ROOT: /srv/tracelab/blobs
      CLOUD_TMP_ROOT: /srv/tracelab/tmp
      CLOUD_RUN_MIGRATIONS_ON_START: "false"
    command: ["uvicorn", "app.cloud:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - /srv/tracelab/blobs:/srv/tracelab/blobs
      - /srv/tracelab/tmp:/srv/tracelab/tmp
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 3g
    cpus: 1.5
    logging: *default-logging
    networks: [private]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${CLOUD_ENV_FILE:-.env.cloud}
    environment:
      RUNTIME_MODE: worker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracelab}
      CLOUD_BLOB_ROOT: /srv/tracelab/blobs
      CLOUD_TMP_ROOT: /srv/tracelab/tmp
    command: ["python", "-m", "app.worker"]
    volumes:
      - /srv/tracelab/blobs:/srv/tracelab/blobs
      - /srv/tracelab/tmp:/srv/tracelab/tmp
    depends_on:
      migrator:
        condition: service_completed_successfully
    mem_limit: 6g
    cpus: 1.25
    logging: *default-logging
    networks: [private]

  migrator:
    build:
      context: ./backend
    restart: "no"
    env_file: ${CLOUD_ENV_FILE:-.env.cloud}
    environment:
      RUNTIME_MODE: cloud
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracelab}
      CLOUD_RUN_MIGRATIONS_ON_START: "false"
    command: ["python", "-m", "app.cli", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [private]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cloud
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging
    networks: [private]

  backup:
    build:
      context: ./backend
    profiles: [maintenance]
    env_file: ${CLOUD_ENV_FILE:-.env.cloud}
    entrypoint: ["/bin/sh", "/opt/tracelab/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tracelab}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tracelab}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./deploy/backup.sh:/opt/tracelab/backup.sh:ro
      - /srv/tracelab/blobs:/srv/tracelab/blobs:ro
      - /srv/tracelab/tmp:/srv/tracelab/tmp
      - ${RCLONE_CONFIG_PATH:-/root/.config/rclone/rclone.conf}:/config/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    logging: *default-logging

networks:
  private:
    internal: false
