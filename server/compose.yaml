x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-server: &server
  build:
    context: .
  env_file: ${SERVER_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracelab}
    CLOUD_BLOB_ROOT: /srv/tracelab/blobs
    CLOUD_TMP_ROOT: /srv/tracelab/tmp
  volumes:
    - ${TRACELAB_DATA_ROOT:-/srv/tracelab}/blobs:/srv/tracelab/blobs
    - ${TRACELAB_DATA_ROOT:-/srv/tracelab}/tmp:/srv/tracelab/tmp
  logging: *default-logging
  networks: [private, outbound]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: ${POSTGRES_DB:-tracelab}
    volumes:
      - ${TRACELAB_DATA_ROOT:-/srv/tracelab}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 1.0
    logging: *default-logging
    networks: [private]

  migrator:
    <<: *server
    restart: "no"
    command: ["python", "-m", "tracelab_server.cli", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    restart: unless-stopped
    command:
      - uvicorn
      - tracelab_server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 3g
    cpus: 1.5

  worker:
    <<: *server
    restart: unless-stopped
    command: ["python", "-m", "tracelab_server.worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 0.75

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in server/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy_params:/etc/nginx/proxy_params:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${TRACELAB_ACME_ROOT:-/var/www/acme}:/var/www/acme:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging
    networks: [edge, private]

  backup:
    <<: *server
    profiles: [maintenance]
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/tracelab-server/deploy/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tracelab}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tracelab}
      BACKUP_REMOTE: ${BACKUP_REMOTE}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./deploy/backup.sh:/opt/tracelab-server/deploy/backup.sh:ro
      - ${TRACELAB_DATA_ROOT:-/srv/tracelab}/blobs:/srv/tracelab/blobs:ro
      - ${TRACELAB_DATA_ROOT:-/srv/tracelab}/tmp:/srv/tracelab/tmp
      - ${RCLONE_CONFIG_PATH:-/root/.config/rclone/rclone.conf}:/config/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge: {}
  outbound: {}
  private:
    internal: true
