[project]
name = "tracelab-sync-server"
version = "0.3.0"
description = "Standalone account, synchronization, blob, and administration server for TraceLab."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.1",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["tracelab_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tracelab_server/db/migrations/versions/*.py" = ["E501", "I001", "UP007", "UP035"]
