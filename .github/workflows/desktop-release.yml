name: Desktop Release

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop bundles
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles app,dmg
      - name: Upload macOS bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracelab-desktop-macos
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop installers
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles msi,nsis
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracelab-desktop-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
