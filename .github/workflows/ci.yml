name: CI

on:
  push:
  pull_request:

jobs:
  local-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Local backend checks
        working-directory: backend
        run: |
          # ``rag`` extra pulls LanceDB / langchain-openai so the optional vector
          # backends are present for the RAG coverage gate (skipped otherwise).
          uv sync --frozen --extra dev --extra rag
          uv run ruff check app tests "../FinalRelease/单元测试代码"
          uv run pytest -q
          uv run pytest -q \
            tests/test_code_analyzer.py \
            tests/repositories/test_analysis.py \
            tests/repositories/test_file_access.py \
            "../FinalRelease/单元测试代码/test_code_analysis_boundaries.py" \
            "../FinalRelease/单元测试代码/test_code_analysis_extended.py" \
            --cov=app.services.code_analysis \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            --cov-fail-under=90.01
          uv run pytest -q tests/rag \
            --cov=app.services.rag \
            --cov-report=term-missing \
            --cov-report=xml:rag-coverage.xml \
            --cov-report=html:rag-htmlcov \
            --junitxml=rag-junit.xml \
            --cov-fail-under=90.01
          uv run pytest -q \
            tests/tracing/test_annotation_mode.py \
            tests/agent/test_confidence_boundaries.py \
            tests/projects/test_project_confidence_api.py \
            tests/test_confidence_migration.py \
            --cov=app.services.tracing.manual_anchors \
            --cov=app.services.agent.confidence \
            --cov=app.api.routes.projects \
            --cov=app.schemas.projects \
            --cov=app.db.migrations.versions.0014_project_deep_thinking \
            --cov-report=term-missing \
            --cov-report=xml:trace-authoring-coverage.xml \
            --cov-report=html:trace-authoring-htmlcov \
            --junitxml=trace-authoring-junit.xml \
            --cov-fail-under=90.01
      - name: Upload local backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-backend-test-reports
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/junit.xml
            backend/rag-coverage.xml
            backend/rag-htmlcov/
            backend/rag-junit.xml
            backend/trace-authoring-coverage.xml
            backend/trace-authoring-htmlcov/
            backend/trace-authoring-junit.xml

  vscode-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: VS Code core unit tests and coverage
        working-directory: packages/tracelab_core
        run: |
          uv sync --frozen --extra dev
          uv run ruff check tracelab_core/workspace.py tracelab_core/review.py tracelab_core/probe.py tests
          uv run pytest -q --junitxml=junit.xml --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Upload VS Code core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-core-test-reports
          path: |
            packages/tracelab_core/coverage.xml
            packages/tracelab_core/htmlcov/
            packages/tracelab_core/junit.xml

  sync-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracelab
          POSTGRES_PASSWORD: tracelab-test
          POSTGRES_DB: tracelab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracelab -d tracelab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://tracelab:tracelab-test@127.0.0.1:5432/tracelab_test
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/tracelab-server-ci.db
      CLOUD_BLOB_ROOT: /tmp/tracelab-server/blobs
      CLOUD_TMP_ROOT: /tmp/tracelab-server/tmp
      CLOUD_JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      CLOUD_SYNC_FEATURE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync server checks
        working-directory: server
        run: |
          uv sync --frozen --extra dev
          uv run ruff check tracelab_server tests
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend checks
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=frontend-unit-junit.xml
          pnpm typecheck
          pnpm build
      - name: Upload frontend unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-report
          path: frontend/frontend-unit-junit.xml

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: VS Code extension compile and unit tests
        working-directory: vscode-extension
        run: |
          npm ci
          npm test
