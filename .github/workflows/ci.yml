name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracelab
          POSTGRES_PASSWORD: tracelab-test
          POSTGRES_DB: tracelab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracelab -d tracelab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://tracelab:tracelab-test@127.0.0.1:5432/tracelab_test
      CLOUD_SYNC_FEATURE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Backend checks
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check app tests
          uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend checks
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
